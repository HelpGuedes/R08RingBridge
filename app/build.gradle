plugins { id 'com.android.application' }
android {
    namespace 'com.r08.ringbridge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.r08.ringbridge'
        minSdk 31
        targetSdk 34
        // GitHub build number, so each build is a newer version (local builds use 1)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.3." + (System.getenv('GITHUB_RUN_NUMBER') ?: 'local')
    }
    // Fixed signing key (committed on purpose) so every build can be installed as an upgrade.
    signingConfigs {
        fixed {
            storeFile file('ringbridge-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
